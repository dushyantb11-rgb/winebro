<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">WineBro app icon</title>
  <desc id="desc">A cream wine glass with Paprika wine on a solid Paprika background.</desc>
  <!-- Default colour master: deliberately full-bleed; the platform supplies the outer mask. -->
  <rect width="1024" height="1024" fill="#93003C"/>
  <g fill="#FAF6EE">
    <!-- Filled bowl keeps the mark legible at 16–32px; the inner wine plane is cut back in brand colour. -->
    <path d="M334 226C304 348 319 500 387 578C437 636 587 636 637 578C705 500 720 348 690 226Z"/>
    <path d="M490 618H534V766H490Z"/>
    <path d="M356 788C356 767 426 752 512 752C598 752 668 767 668 788C668 809 598 824 512 824C426 824 356 809 356 788Z"/>
  </g>
  <!-- Wine area: intentionally the same Paprika as the background, leaving a sturdy cream glass silhouette. -->
  <path d="M366 407Q512 372 658 407L651 468C640 532 594 579 512 579C430 579 384 532 373 468Z" fill="#93003C"/>
</svg>
